<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#130708">
<title>Canta Corazón · Sistema interno</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../shared/img/apple-touch-icon.png">
<link rel="icon" href="../shared/img/fav.svg">
<link rel="stylesheet" href="../shared/brand.css">
<style>
  body { background: var(--dark); color: var(--darktext); }
  a { color: inherit; }
  #app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  aside { background: #0E0506; border-right: 1px solid var(--darkline); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  aside .logo { height: 13px; display: block; margin: 4px 0 18px 4px; }
  aside .who { background: var(--dark2); border: 1px solid var(--darkline); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  aside .who b { display: block; font-size: 13px; } aside .who span { display: block; font-size: 11px; color: var(--darkmuted); }
  aside nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; color: var(--darkmuted); padding: 10px 10px; border-radius: 10px; font-weight: 600; font-size: 13.5px; }
  aside nav button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 18px; }
  aside nav button.on { background: var(--terra); color: var(--paper); }
  aside nav button .n { margin-left: auto; background: var(--rust); color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 2px 7px; }
  aside .foot { margin-top: 16px; font-size: 10.5px; color: var(--darkmuted); line-height: 1.5; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--darkline); position: sticky; top: 0; background: var(--dark); z-index: 10; }
  .topbar h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  .topbar .sub { font-size: 12px; color: var(--darkmuted); }
  .seg { display: inline-flex; background: var(--dark2); border: 1px solid var(--darkline); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: var(--darkmuted); font-weight: 700; font-size: 12px; padding: 7px 12px; border-radius: 999px; }
  .seg button.on { background: var(--paper); color: var(--ink); }
  main { padding: 18px 22px 40px 22px; }
  .kgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .k { background: var(--dark2); border: 1px solid var(--darkline); border-radius: 12px; padding: 12px 14px; }
  .k small { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--darkmuted); font-weight: 700; margin-bottom: 6px; }
  .k b { font-family: var(--num); font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .k b.good { color: #7ED3A0; } .k b.warm { color: #F2A48B; } .k b.amber { color: #F1C453; }
  .k .d { display: inline-block; margin-left: 8px; font-family: var(--num); font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; vertical-align: 3px; }
  .d.up { background: #2C2D26; color: #7ED3A0; } .d.dn { background: #401D22; color: #FB7185; }
  .k .s { display: block; font-size: 11px; color: var(--darkmuted); margin-top: 6px; }
  .grid { display: grid; gap: 12px; margin-top: 12px; }
  .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: 1fr 1fr 1fr; } .g32 { grid-template-columns: 3fr 2fr; } .g23 { grid-template-columns: 2fr 3fr; }
  .card { background: var(--dark2); border: 1px solid var(--darkline); border-radius: 14px; padding: 14px 16px; }
  .card h3 { margin: 0 0 10px 0; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  .card h3 span { color: var(--darkmuted); font-weight: 600; }
  .card.cream { background: var(--paper); color: var(--ink); border: 0; }
  .card.terra { background: var(--terra); color: var(--paper); border: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--darkmuted); } .small { font-size: 12px; } .tiny { font-size: 10.5px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; font-size: 13px; background: var(--terra); color: var(--paper); }
  .btn.sec { background: var(--dark3); color: var(--darktext); border: 1px solid var(--darkline); }
  .btn.ok { background: #1F7A4D; } .btn.bad { background: #8B1E25; } .btn.gold { background: var(--gold); color: var(--dark); }
  .btn.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn:disabled { opacity: .45; }
  .badge { display: inline-block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; padding: 4px 9px; border-radius: 999px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--darkmuted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--darkline); }
  td { padding: 8px 8px; border-bottom: 1px solid var(--darkline); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--dark3); color: var(--darktext); }
  .pill.ok { background: #1F3A2C; color: #7ED3A0; } .pill.warn { background: #3A2E12; color: #F1C453; } .pill.bad { background: #401D22; color: #FB7185; } .pill.info { background: #1F2E3A; color: #8FD0FF; }
  .bar { height: 8px; border-radius: 999px; background: var(--darkline); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--terra); }
  .bar i.two { background: #E9A98F; }
  .hrow { display: flex; align-items: center; gap: 10px; font-size: 12px; margin: 6px 0; color: var(--darkmuted); }
  .hrow .nm { width: 120px; color: var(--darktext); } .hrow .bar { flex: 1; } .hrow .vl { width: 70px; text-align: right; color: var(--darktext); font-family: var(--num); font-weight: 700; }
  .plano svg { width: 100%; height: auto; display: block; }
  .leyenda { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--darkmuted); margin-top: 8px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  input.txt, select.txt, textarea.txt { width: 100%; border: 1px solid var(--darkline); border-radius: 10px; padding: 10px 12px; background: #0E0506; color: var(--darktext); }
  label.lbl { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--darkmuted); font-weight: 700; margin: 10px 0 5px 0; }
  .feed div { padding: 7px 0; border-bottom: 1px solid var(--darkline); font-size: 12px; }
  .feed div:last-child { border-bottom: 0; }
  .feed time { color: var(--darkmuted); font-family: var(--num); margin-right: 8px; }
  .kds { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .ocard { background: var(--dark3); border: 1px solid var(--darkline); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .ocard b { font-size: 13px; } .ocard .it { font-size: 12px; color: var(--darktext); margin: 6px 0; } .ocard .meta { font-size: 11px; color: var(--darkmuted); }
  .scanwrap { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 4/3; }
  .scanwrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanwrap .frame { position: absolute; inset: 14%; border: 2px solid var(--paper); border-radius: 14px; }
  .scanwrap .hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: #fff; }
  .result { border-radius: 14px; padding: 16px; background: var(--dark2); border: 1px solid var(--darkline); }
  .result .big { font-family: var(--num); font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 8px 0 2px 0; line-height: 1; }
  .result .r { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--darkline); }
  .result .r span:first-child { color: var(--darkmuted); }
  .result.ok { border-color: #2E9E6B; } .result.bad { border-color: #C8323A; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .sheet { background: var(--dark2); border: 1px solid var(--darkline); border-radius: 18px; padding: 18px; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 60; }
  .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--dark); }
  .login .box { width: 100%; max-width: 760px; }
  .roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .roles button { background: var(--dark2); border: 1px solid var(--darkline); border-radius: 14px; padding: 16px 12px; color: var(--darktext); text-align: left; }
  .roles button b { display: block; font-size: 14px; } .roles button span { display: block; font-size: 11.5px; color: var(--darkmuted); margin-top: 4px; }
  .roles button:hover { border-color: var(--terra); }
  .chat { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow: auto; padding: 4px 0; }
  .cb { max-width: 82%; border-radius: 12px; padding: 9px 12px; font-size: 13px; line-height: 1.45; }
  .cb.me { margin-left: auto; background: var(--terra); color: var(--paper); border-bottom-right-radius: 4px; }
  .cb.ai { background: var(--dark3); border: 1px solid var(--darkline); border-bottom-left-radius: 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { background: var(--dark3); border: 1px solid var(--darkline); color: var(--darktext); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
  .alert { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 8px 0; border-bottom: 1px solid var(--darkline); }
  .alert:last-child { border-bottom: 0; }
  .alert i { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; margin-top: 5px; }
  .cliente-ficha .tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--dark3); margin: 2px 4px 2px 0; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; }
    aside { position: fixed; bottom: 0; left: 0; right: 0; top: auto; height: auto; border-right: 0; border-top: 1px solid var(--darkline); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)) 4px; z-index: 30; overflow-x: auto; }
    aside .logo, aside .who, aside .foot { display: none; }
    aside nav { display: flex; gap: 2px; }
    aside nav button { flex-direction: column; gap: 3px; font-size: 9px; padding: 6px 8px; min-width: 64px; text-align: center; }
    aside nav button .n { margin-left: 0; }
    main { padding: 14px 14px 100px 14px; }
    .kgrid { grid-template-columns: repeat(2, 1fr); }
    .g2, .g3, .g32, .g23, .kds { grid-template-columns: 1fr; }
    .roles { grid-template-columns: 1fr 1fr; }
    .topbar h1 { font-size: 17px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="overlay"></div>
<div id="toast"></div>
<script src="../shared/vendor/chart.umd.min.js"></script>
<script src="../shared/vendor/jsQR.min.js"></script>
<script src="../shared/core.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s); const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = CC.money, pct = CC.pct;
  const qsRol = new URLSearchParams(location.search).get('rol'); if (qsRol) sessionStorage.setItem('cc_rol', qsRol);
  let rol = sessionStorage.getItem('cc_rol') || null;
  let suc = sessionStorage.getItem('cc_isuc') || 's1';
  let view = location.hash.replace('#', '') || 'tablero';
  let sel = { mesaId: null, piso: 1, clienteId: null };
  const charts = {};
  let toastT = null;
  function toast(m) { const t = $('#toast'); t.innerHTML = `<div class="toast">${esc(m)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => t.innerHTML = '', 2600); }
  function sheet(html) { $('#overlay').innerHTML = `<div class="sheet-bg" id="sheetBg"><div class="sheet">${html}</div></div>`; $('#sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeSheet(); }); }
  function closeSheet() { $('#overlay').innerHTML = ''; }
  const S = () => CC.suc(suc);
  const tipoBadge = (t) => { const x = CC.TIPOS_QR[t] || { nombre: t, color: '#555', texto: '#fff' }; return `<span class="badge" style="background:${x.color}; color:${x.texto}">${x.nombre}</span>`; };

  const SECCIONES = [
    ['tablero', 'Tablero', ['socio', 'gerente'], '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>'],
    ['puerta', 'Puerta', ['socio', 'gerente', 'puerta', 'hostess'], '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h3v3h-3zM18 18h2v2h-2zM18 14h2M14 20h3"/></svg>'],
    ['mesas', 'Mesas', ['socio', 'gerente', 'hostess', 'puerta', 'mesero'], '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="6" rx="2"/><path d="M6 13v6M18 13v6M9 13v4M15 13v4"/></svg>'],
    ['barra', 'Barra', ['socio', 'gerente', 'barra', 'mesero'], '<svg viewBox="0 0 24 24"><path d="M6 3h12l-1 8a5 5 0 0 1-10 0z"/><path d="M12 16v5M8 21h8"/></svg>'],
    ['inventario', 'Inventario', ['socio', 'gerente', 'barra', 'compras'], '<svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>'],
    ['compras', 'Compras', ['socio', 'gerente', 'compras'], '<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>'],
    ['caja', 'Caja', ['socio', 'gerente', 'caja'], '<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>'],
    ['clientes', 'Clientes', ['socio', 'gerente', 'hostess'], '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.8"/><path d="M2.5 20c.5-4 3.5-6 6.5-6s6 2 6.5 6M15 14.5c2.8 0 5.5 1.6 6 5.5"/></svg>'],
    ['personal', 'Personal', ['socio', 'gerente'], '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5 18c.6-2.4 2.2-3.5 4-3.5s3.4 1.1 4 3.5M14 9h5M14 13h5"/></svg>'],
    ['asistente', 'Asistente IA', ['socio', 'gerente'], '<svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4z"/></svg>'],
    ['config', 'Configuración', ['socio', 'gerente'], '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>']
  ];
  const ROLES_DEMO = [['socio', 'Socio', 'Todo: tablero, IA, configuración'], ['gerente', 'Gerente', 'Operación completa de la sucursal'], ['hostess', 'Hostess', 'Mesas, reservas, clientes, puerta'], ['puerta', 'Puerta', 'Escáner QR y aforo'], ['barra', 'Barra', 'Pedidos, botellas abiertas, conteo'], ['caja', 'Caja', 'Pagos, efectivo, cortes'], ['compras', 'Compras', 'Facturas XML, inventario, proveedores'], ['mesero', 'Mesero', 'Mesas y pedidos']];
  const permitido = (id) => { const s = SECCIONES.find(x => x[0] === id); return s && s[2].includes(rol); };

  // ═════════════ login ═════════════
  function vLogin() {
    $('#root').innerHTML = `<div class="login"><div class="box"><img src="../shared/img/logo_dark.png" style="height:16px;" alt="Canta Corazón"><h1 style="font-size:28px; margin:14px 0 4px 0;">Sistema interno · <span style="color:var(--terra)">demo</span></h1><p class="muted" style="margin:0;">Elige con qué rol entras. Cada rol ve solo lo que le corresponde. Los datos son ilustrativos y viven en este navegador.</p>
      <div class="roles">${ROLES_DEMO.map(([id, n, d]) => `<button data-rol="${id}"><b>${n}</b><span>${d}</span></button>`).join('')}</div>
      <div class="row" style="margin-top:18px;"><span class="tiny muted">Las dos apps del demo comparten los mismos datos en este dispositivo. Abre la app del cliente en otra pestaña para verlas conversar.</span><a class="btn sec sm" href="../cliente/" target="_blank" style="text-decoration:none; white-space:nowrap;">Abrir app del cliente</a></div></div></div>`;
    $$('[data-rol]').forEach(b => b.onclick = () => { rol = b.dataset.rol; sessionStorage.setItem('cc_rol', rol); view = permitido(view) ? view : SECCIONES.find(s => s[2].includes(rol))[0]; location.hash = view; render(); });
  }

  // ═════════════ shell ═════════════
  function shell(contentHTML, title, sub) {
    const n = CC.M.noche(suc); const abiertos = CC.db.pedidos.filter(p => p.suc === suc && (p.estado === 'nuevo' || p.estado === 'preparando')).length;
    const pend = CC.M.cajaHoy(suc).pendientes.length;
    $('#root').innerHTML = `<div id="app"><aside><img class="logo" src="../shared/img/logo_dark.png" alt=""><div class="who"><b>${esc(CC.ROLES[rol])}</b><span>${esc(S().nombre)} · ${esc(CC.fechaLarga(CC.hoy()))}</span></div><nav>${SECCIONES.filter(s => s[2].includes(rol)).map(([id, l, , ic]) => `<button data-v="${id}" class="${view === id ? 'on' : ''}">${ic}<span>${l}</span>${id === 'barra' && abiertos ? `<span class="n">${abiertos}</span>` : ''}${id === 'caja' && pend ? `<span class="n">${pend}</span>` : ''}</button>`).join('')}</nav><div class="foot">Demo · datos ilustrativos · <button class="btn sec sm" id="btnSalir" style="margin-top:8px;">Cambiar rol</button></div></aside>
      <div><div class="topbar"><div><h1>${title}</h1><div class="sub">${sub || ''}</div></div><div style="display:flex; gap:10px; align-items:center;"><div class="seg">${CC.SUCURSALES().map(s => `<button data-suc="${s.id}" class="${suc === s.id ? 'on' : ''}">${esc(s.nombre)}</button>`).join('')}<button data-suc="all" class="${suc === 'all' ? 'on' : ''}">Ambas</button></div><span class="pill ok">● en vivo</span></div></div><main id="main">${contentHTML}</main></div></div>`;
    $$('[data-v]').forEach(b => b.onclick = () => { stopScan(); view = b.dataset.v; location.hash = view; render(); });
    $$('[data-suc]').forEach(b => b.onclick = () => { suc = b.dataset.suc; sessionStorage.setItem('cc_isuc', suc); if (suc === 'all' && !['tablero', 'asistente', 'clientes', 'personal', 'compras', 'caja'].includes(view)) suc = 's1'; render(); });
    $('#btnSalir').onclick = () => { stopScan(); rol = null; sessionStorage.removeItem('cc_rol'); render(); };
  }
  function chart(id, cfg) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } const el = document.getElementById(id); if (!el) return; Chart.defaults.color = '#B69A92'; Chart.defaults.borderColor = '#2E2022'; Chart.defaults.font.family = 'Montserrat, sans-serif'; Chart.defaults.font.size = 11; charts[id] = new Chart(el, cfg); }

  // ═════════════ TABLERO ═════════════
  function vTablero() {
    const n = CC.M.noche(suc); const comp = CC.M.comparativo(); const dias = CC.M.porDiaSemana(suc, 90); const mejor = dias.slice().sort((a, b) => b.prom - a.prom)[0]; const horas = CC.M.porHora(suc); const meses = CC.M.porMes(suc); const top = CC.M.topProductos(suc, 6); const merma = CC.M.mermaUltima(suc); const teo = suc === 'all' ? [] : CC.M.teoricoBotellas(suc);
    const alertas = [];

  <cfdi:Complemento><tfd:TimbreFiscalDigital Version="1.1" UUID="6B2D9F1E-DEMO-4C1A-9E7B-CANTACORAZON" FechaTimbrado="${CC.hoy()}T10:22:20"/></cfdi:Complemento>
</cfdi:Comprobante>`;
  function parseCFDI(txt) {
    const doc = new DOMParser().parseFromString(txt, 'application/xml'); const q = (sel) => doc.getElementsByTagNameNS('*', sel)[0];
    const comp = q('Comprobante'); if (!comp) throw new Error('No es un CFDI');
    const em = q('Emisor'); const tfd = q('TimbreFiscalDigital');
    const conceptos = Array.from(doc.getElementsByTagNameNS('*', 'Concepto')).map(c => ({ desc: c.getAttribute('Descripcion'), cant: Number(c.getAttribute('Cantidad')), unit: Number(c.getAttribute('ValorUnitario')), importe: Number(c.getAttribute('Importe')) }));
    return { folio: (comp.getAttribute('Serie') || '') + '-' + (comp.getAttribute('Folio') || ''), fecha: (comp.getAttribute('Fecha') || '').slice(0, 10), subtotal: Number(comp.getAttribute('SubTotal')), total: Number(comp.getAttribute('Total')), emisor: em ? em.getAttribute('Nombre') : '', rfc: em ? em.getAttribute('Rfc') : '', uuid: tfd ? tfd.getAttribute('UUID') : '', conceptos };
  }
  function adivinarProducto(desc) { const d = desc.toLowerCase(); return (CC.db.productos.find(p => d.includes(p.nombre.toLowerCase().split(' ')[0]) && (p.cat === 'botella' || p.cat === 'cerveza' || p.cat === 'comida' || p.id === 'x_sombrero') && (d.includes(p.nombre.toLowerCase().split(' ')[1] || '') || p.cat !== 'botella')) || CC.db.productos.find(p => d.includes(p.nombre.toLowerCase().split(' ')[0])) || {}).id || ''; }

    const cambios = Object.entries(precios).map(([pid, arr]) => ({ pid, nombre: (CC.prod(pid) || {}).nombre, primero: arr[0].unit, ultimo: arr[arr.length - 1].unit, delta: (arr[arr.length - 1].unit - arr[0].unit) / arr[0].unit * 100, n: arr.length })).filter(x => x.n > 1).sort((a, b) => b.delta - a.delta);

      <div class="grid g32"><div class="card"><div class="row"><h3 style="margin:0;">Facturas de proveedor</h3><div style="display:flex; gap:8px;"><button class="btn sec sm" id="btnManualF">Capturar a mano</button><button class="btn sm" id="btnXML">Importar XML (CFDI)</button></div></div>
        <table style="margin-top:10px;"><thead><tr><th>Fecha</th><th>Proveedor</th><th>Folio</th><th>Sucursal</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>${facts.slice(0, 14).map(f => `<tr><td class="num">${esc(f.fecha)}</td><td>${esc((CC.prov(f.provId) || { nombre: f.emisor }).nombre)}</td><td>${esc(f.folio)}</td><td>${esc(CC.suc(f.suc).nombre)}</td><td class="num">${money(f.total, 2)}</td><td>${f.estado === 'pagada' ? '<span class="pill ok">pagada</span>' : `<button class="btn sec sm" data-pagar="${f.id}">Marcar pagada</button>`}</td></tr>`).join('')}</tbody></table></div>

        <div class="card" style="margin-top:12px;"><h3>Proveedores</h3>${CC.db.proveedores.map(p => `<div class="row small" style="padding:6px 0; border-bottom:1px solid var(--darkline);"><span><b>${esc(p.nombre)}</b><br><span class="muted">${esc(p.cat)} · ${esc(p.rfc)}</span></span><span class="num">${money(CC.db.facturas.filter(f => f.provId === p.id).reduce((a, f) => a + f.total, 0))}</span></div>`).join('')}</div></div></div>`;

      const dm = $('#xDemo'); if (dm) dm.onclick = () => { data = parseCFDI(XML_EJEMPLO); draw(); };

    const emp = CC.db.personal.filter(e => (suc === 'all' || e.suc === suc) && e.rol !== 'socio');
    const ventasMesero = {}; CC.db.pedidos.filter(p => p.meseroId).forEach(p => { ventasMesero[p.meseroId] = (ventasMesero[p.meseroId] || 0) + p.items.reduce((a, i) => a + i.precio * i.cant, 0); });
    const html = `<div class="kgrid" style="grid-template-columns: repeat(4,1fr);"><div class="k"><small>Personal activo</small><b>${emp.length}</b><span class="s">${suc === 'all' ? 'ambas sucursales' : esc(S().nombre)}</span></div><div class="k"><small>En turno ahora</small><b class="good">${emp.filter(e => e.checkin).length}</b><span class="s">check-in registrado</span></div><div class="k"><small>Sin check-in</small><b class="amber">${emp.filter(e => !e.checkin && e.turno.startsWith('Noche')).length}</b><span class="s">del turno de noche</span></div><div class="k"><small>Propinas hoy</small><b>${money(CC.db.pagos.filter(p => p.fecha === CC.hoy() && (suc === 'all' || p.suc === suc)).reduce((a, p) => a + (p.propina || 0), 0))}</b><span class="s">se reparten por regla</span></div></div>
      <div class="card" style="margin-top:12px;"><h3>Equipo</h3><table><thead><tr><th>Nombre</th><th>Rol</th><th>Sucursal</th><th>Turno</th><th>Check-in</th><th class="num">Ventas hoy</th><th></th></tr></thead><tbody>${emp.map(e => `<tr><td><b>${esc(e.nombre)}</b><br><span class="small muted">desde ${e.ingreso} · ${esc(e.tel.replace(/(\d{2})(\d{4})(\d{4})/, '$1 $2 $3'))}</span></td><td>${esc(CC.ROLES[e.rol] || e.rol)}</td><td>${esc(CC.suc(e.suc).nombre)}</td><td class="small">${esc(e.turno)}</td><td>${e.checkin ? `<span class="pill ok">${esc(e.checkin)}</span>` : '<span class="pill warn">sin registrar</span>'}</td><td class="num">${e.rol === 'mesero' ? money(ventasMesero[e.id] || 0) : '—'}</td><td>${e.checkin ? '' : `<button class="btn sec sm" data-ci="${e.id}">Check-in</button>`}</td></tr>`).join('')}</tbody></table></div>`;
    shell(html, 'Personal', 'Quién está en piso, quién vendió qué, propinas y asistencia');
    $$('[data-ci]').forEach(b => b.onclick = () => { CC.emp(b.dataset.ci).checkin = CC.ahoraHM(); CC.save(); render(); });
  }

  // ═════════════ ASISTENTE ═════════════
  const chatHist = [];
  function vAsistente() {
    const sugeridas = ['¿Qué sucursal vendió más esta noche?', '¿Cómo va la merma?', '¿Cuál es el mejor día?', '¿A qué hora vendemos más?', '¿Qué temporada es la mejor?', '¿Cómo van los clientes VIP?', '¿Qué es lo más vendido?', '¿Qué hay pendiente en caja?'];
    const html = `<div class="grid g23" style="margin-top:0;"><div class="card"><h3>Asistente de socios <span>· responde con los números del sistema</span></h3><div class="chat" id="chat">${chatHist.length ? chatHist.map(m => `<div class="cb ${m.me ? 'me' : 'ai'}">${esc(m.t)}</div>`).join('') : '<div class="cb ai">Pregúntame por ventas, merma, mejor día u hora, temporada, VIP, productos o caja. Los números salen de la base; en el demo la redacción es por reglas y en la fase real la hace Claude o GPT.</div>'}</div>
      <div class="row" style="margin-top:10px;"><input class="txt" id="q" placeholder="Escribe tu pregunta…"><button class="btn" id="ask">Preguntar</button></div><div class="chips" style="margin-top:8px;">${sugeridas.map(s => `<button data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
      <div><div class="card cream"><h3 style="color:var(--terra);">Qué hace en la fase real</h3><div class="small" style="line-height:1.55;"><b>Responde</b> con el número exacto y su fuente.<br><b>Analiza</b> por sucursal, día, hora, producto y persona.<br><b>Critica</b> lo que no cuadra: cortesías, precios, no-shows.<br><b>Encuentra</b> merma, cortes descuadrados, VIP que dejaron de venir.<br><b>Resuelve</b>: prepara el mensaje o la alerta y da seguimiento.</div></div><div class="card" style="margin-top:12px;"><h3>Reglas</h3><div class="small muted" style="line-height:1.55;">Los números los saca el sistema; la IA los explica y nunca inventa. Cada rol pregunta solo sobre lo suyo. Llaves en el servidor, bitácora y tope de gasto.</div></div></div></div>`;
    shell(html, 'Asistente de IA', 'Cualquier número que necesiten, al momento');
    const ask = () => { const q = $('#q').value.trim(); if (!q) return; chatHist.push({ me: true, t: q }); chatHist.push({ me: false, t: CC.asistente(q) }); render(); setTimeout(() => { const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight; }, 0); };
    $('#ask').onclick = ask; $('#q').onkeydown = (e) => { if (e.key === 'Enter') ask(); };
    $$('[data-q]').forEach(b => b.onclick = () => { $('#q').value = b.dataset.q; ask(); });
    const c = $('#chat'); c.scrollTop = c.scrollHeight;
  }

  // ═════════════ CONFIG ═════════════
  function vConfig() {
    const sucId = suc === 'all' ? 's1' : suc; const mesas = CC.db.mesas.filter(m => m.suc === sucId);
    const html = `<div class="grid g32" style="margin-top:0;"><div class="card"><h3>Mesas de ${esc(CC.suc(sucId).nombre)} <span>· capacidad, tipo, mínimo y anticipo</span></h3><table><thead><tr><th>Mesa</th><th>Piso</th><th>Tipo</th><th class="num">Cap.</th><th class="num">Mínimo</th><th class="num">Anticipo</th></tr></thead><tbody>${mesas.map(m => `<tr><td><b>${m.num}</b>${m.salon ? ' · ' + esc(m.salon) : ''}</td><td>${m.piso}</td><td><select class="txt" data-t="${m.id}" style="padding:4px 8px; width:auto;">${['mesa', 'vip'].map(t => `<option value="${t}" ${m.tipo === t ? 'selected' : ''}>${CC.TIPOS_QR[t].nombre}</option>`).join('')}</select></td><td><input class="txt" data-cap="${m.id}" type="number" value="${m.cap}" style="width:64px; text-align:right; padding:4px 8px;"></td><td><input class="txt" data-min="${m.id}" type="number" value="${m.minimo}" style="width:96px; text-align:right; padding:4px 8px;"></td><td><input class="txt" data-ant="${m.id}" type="number" value="${m.anticipo}" style="width:96px; text-align:right; padding:4px 8px;"></td></tr>`).join('')}</tbody></table><button class="btn" id="cfgGuardar" style="margin-top:12px;">Guardar cambios</button></div>
      <div><div class="card"><h3>Tipos de QR</h3>${Object.entries(CC.TIPOS_QR).map(([k, t]) => `<div class="row small" style="padding:6px 0; border-bottom:1px solid var(--darkline);"><span>${tipoBadge(k)}</span><span class="muted">${esc(t.desc)}</span></div>`).join('')}</div>
        <div class="card" style="margin-top:12px;"><h3>Precios y visibilidad</h3><label class="lbl">Cover</label><input class="txt" id="pCover" type="number" value="${CC.PRECIOS().cover}"><label class="lbl">Acceso barra</label><input class="txt" id="pBarra" type="number" value="${CC.PRECIOS().barra}"><label class="lbl">El cliente ve el cupo de la noche</label><select class="txt" id="pCupo"><option value="1" ${CC.db.config.cupoVisible ? 'selected' : ''}>Sí, muestra el porcentaje</option><option value="0" ${!CC.db.config.cupoVisible ? 'selected' : ''}>No</option></select><button class="btn sec" id="cfgPrecios" style="margin-top:10px; width:100%;">Guardar</button></div>
        <div class="card" style="margin-top:12px;"><h3>Demo</h3><div style="display:flex; gap:8px; flex-wrap:wrap;"><button class="btn sec sm" id="btnExport">Exportar datos (JSON)</button><button class="btn bad sm" id="btnReset">Reiniciar datos del demo</button></div></div></div></div>`;
    shell(html, 'Configuración', 'Planos, tipos de QR, precios y reglas');
    $('#cfgGuardar').onclick = () => { mesas.forEach(m => { m.tipo = $(`[data-t="${m.id}"]`).value; m.cap = Number($(`[data-cap="${m.id}"]`).value); m.minimo = Number($(`[data-min="${m.id}"]`).value); m.anticipo = Number($(`[data-ant="${m.id}"]`).value); }); CC.save(); toast('Mesas actualizadas en ambas apps'); };
    $('#cfgPrecios').onclick = () => { CC.db.config.precios.cover = Number($('#pCover').value); CC.db.config.precios.barra = Number($('#pBarra').value); CC.db.config.cupoVisible = $('#pCupo').value === '1'; CC.save(); toast('Guardado'); };
    $('#btnExport').onclick = () => { const a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(CC.db, null, 1)); a.download = 'canta-corazon-demo.json'; a.click(); };
    $('#btnReset').onclick = () => { if (confirm('¿Reiniciar todos los datos del demo en este navegador?')) { CC.reset(); toast('Datos reiniciados'); render(); } };
  }

  // ═════════════ render ═════════════
  function render() {
    if (!rol) { vLogin(); return; }
    if (!permitido(view)) view = SECCIONES.find(s => s[2].includes(rol))[0];
    ({ tablero: vTablero, puerta: vPuerta, mesas: vMesas, barra: vBarra, inventario: vInventario, compras: vCompras, caja: vCaja, clientes: vClientes, personal: vPersonal, asistente: vAsistente, config: vConfig }[view] || vTablero)();
  }
  window.addEventListener('hashchange', () => { const v = location.hash.replace('#', ''); if (v && v !== view) { stopScan(); view = v; render(); } });
  CC.on(() => { if ($('#sheetBg')) return; if (view === 'puerta' && scanStream) return; if (document.activeElement && document.activeElement.tagName === 'INPUT') return; render(); });
  render();
})();
</script>
</body>
</html>
